# A LiteLLM config that hard-codes a credential. The importer must refuse it outright rather
# than copy the value into a generated file or quietly drop the key.
model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_base: https://api.openai.com/v1
      api_key: sk-real-looking-value
