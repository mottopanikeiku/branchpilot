[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "branchpilot"
version = "0.2.0"
description = "Budget-conditioned offline RL for adaptive LLM inference-time compute"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "mottopanikeiku" }]
keywords = ["reinforcement-learning", "llm-inference", "test-time-compute", "optimal-stopping"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "rich>=13.7,<15",
  "safetensors>=0.6,<1",
]

[project.optional-dependencies]
train = [
  "torch>=2.6,<3",
]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
  "torch>=2.6,<3",
]
modal = [
  "modal>=1.5,<2",
]

[project.urls]
Homepage = "https://github.com/mottopanikeiku/branchpilot"
Repository = "https://github.com/mottopanikeiku/branchpilot"
Issues = "https://github.com/mottopanikeiku/branchpilot/issues"
Benchmark = "https://mottopanikeiku.github.io/branchpilot/"

[project.scripts]
branchpilot = "branchpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/branchpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/branchpilot/report.py" = ["E501"]
