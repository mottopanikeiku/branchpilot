name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install locked training and math environment
        run: uv sync --locked --extra dev --extra math
      - name: Lint
        if: matrix.python == '3.14'
        run: uv run --extra dev --extra math ruff check .
      - name: Check formatting
        if: matrix.python == '3.14'
        run: uv run --extra dev --extra math ruff format --check .
      - name: Test
        run: uv run --extra dev --extra math pytest tests
      - name: Test its-hub integration
        if: matrix.python == '3.14'
        run: uv run --extra dev --extra math --extra its-hub pytest tests/test_its_hub_integration.py
      - name: Verify evidence checksums
        if: matrix.python == '3.14'
        run: (cd benchmarks && sha256sum -c checksums-v2.txt && sha256sum -c checksums-v3-development.txt)
      - name: Smoke test CLI
        if: matrix.python == '3.14'
        run: >-
          uv run --extra dev --extra math branchpilot quickstart
          --output-dir artifacts/ci
          --train-size 64
          --validation-size 32
          --test-size 32
          --epochs 8
      - name: Import pinned Modal applications
        if: matrix.python == '3.14'
        run: >-
          uv run --extra dev --extra math --extra modal python -c
          "import modal_app; import runpy; runpy.run_path('tools/collect_math500.py')"

  package:
    name: Torch-free wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install locked build environment
        run: uv sync --locked --extra build
      - name: Build release artifacts
        run: uv build --no-build-isolation
      - name: Install wheel without training dependencies
        run: |
          uv venv --python 3.14 .venv-runtime
          uv pip install --python .venv-runtime/bin/python dist/*.whl
      - name: Verify lightweight runtime
        run: |
          .venv-runtime/bin/python -c "import branchpilot; from importlib.util import find_spec; assert find_spec('torch') is None"
          .venv-runtime/bin/branchpilot --help
          .venv-runtime/bin/branchpilot-gateway --help
