name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install locked training environment
        run: uv sync --locked --extra dev
      - name: Lint
        if: matrix.python == '3.14'
        run: uv run ruff check .
      - name: Check formatting
        if: matrix.python == '3.14'
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest tests
      - name: Smoke test CLI
        if: matrix.python == '3.14'
        run: >-
          uv run branchpilot quickstart
          --output-dir artifacts/ci
          --train-size 64
          --test-size 32
          --epochs 8
      - name: Import pinned Modal application
        if: matrix.python == '3.14'
        run: uv run --extra modal python -c "import modal_app"

  package:
    name: Torch-free wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Build release artifacts
        run: uv build
      - name: Install wheel without training dependencies
        run: |
          uv venv --python 3.14 .venv-runtime
          uv pip install --python .venv-runtime/bin/python dist/*.whl
      - name: Verify lightweight runtime
        run: |
          .venv-runtime/bin/python -c "import branchpilot; from importlib.util import find_spec; assert find_spec('torch') is None"
          .venv-runtime/bin/branchpilot --help
