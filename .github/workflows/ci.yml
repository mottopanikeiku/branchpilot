name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest tests
      - name: Smoke test CLI
        run: >-
          uv run branchpilot quickstart
          --output-dir artifacts/ci
          --train-size 64
          --test-size 32
          --epochs 8
